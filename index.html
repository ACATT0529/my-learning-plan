<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自主學習計畫</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f9f9f9;
            color: #222;
        }
        header {
            border-bottom: 3px solid #0056b3;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 { color: #0056b3; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.1em; }
        .card {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }
        h2 { color: #333; margin-top: 0; border-left: 4px solid #0056b3; padding-left: 10px; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>MY_LEARNING_PLAN</h1>
        <p class="subtitle">追求自我提升與深度探索的學習歷程網頁</p>
    </header>

    <div class="card">
        <h2>自學動機與核心理念</h2>
        <p>希望能根據個人的吸收步調彈性調整進度，針對重點領域進行深度探索與自主管理，達成高效且持續的自我導向學習。</p>
    </div>

    <div class="card">
        <h2>TARGETS_AND_PLANS</h2>
        <ul>
            <li><strong>第一階段：</strong> 基礎工具建立與專案架構規劃。</li>
            <li><strong>第二階段：</strong> 深度知識探索與個人作品集實作。</li>
            <li><strong>第三階段：</strong> 學習成果整理與公開發表。</li>
        </ul>
    </div>
</body>
</html>
